<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .conteiner{
            border: 4px solid black;
            display: grid;
            height: 1000px;
            grid-template-columns: auto auto auto;
          
            
        }
        div{
            border: 1px solid red;
        }
       



    </style>



</head>
<body>
    
    <div class="conteiner">
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>
        <div>E</div>
    </div>



</body>
</html>

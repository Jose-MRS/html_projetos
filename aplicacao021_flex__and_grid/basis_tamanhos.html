<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .pai{
            display: flex; 
            flex-flow: row nowrap;
            justify-content: center;
        }
        .filhos{
            flex-basis: 200px;
            border: 2px solid red;
            
        }
        #teste1{
            flex-basis: 200px;
            flex-shrink: 1;
            flex-grow: 2;
        }
        #teste2{
            flex-basis: 200px;
            flex-shrink: 2;
            flex-grow: 0;
        }
        #teste3{
            flex-basis: 200px;
            flex-shrink: 0;
            flex-grow: 1;
            flex: 0 1 200px;
        }
        




    </style>
</head>
<body>

    <div class="pai">
        <div class="filhos" id="teste1"><p>A1</p></div>
        <div class="filhos" id="teste2"><p>B2</p></div>
        <div class="filhos" id="teste3"><p>C3</p></div>
    </div>
    
</body>
</html>
